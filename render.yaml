services:
  - type: web
    name: postech-ml-engineering-fase-1-api
    runtime: python
    plan: free
    buildCommand: |
      pip install poetry
      poetry config virtualenvs.create false
      poetry install
    startCommand: "flask db upgrade && python app.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postech-ml-engineering-fase-1-api-db
          property: connectionString
      - key: FLASK_APP
        value: app.py
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET_KEY
        sync: false 

databases:
  - name: postech-ml-engineering-fase-1-api-db
    user: postech
    plan: free
    region: oregon 